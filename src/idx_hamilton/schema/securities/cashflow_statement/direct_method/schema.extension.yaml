$schema: "http://json-schema.org/draft-07/schema#"

allOf:
  - $ref: "../../../base_schema.yaml"
  - properties:
      chart_of_accounts:
        items:
          $ref: "#/definitions/AccountNode"
      assertions:
        items:
          $ref: "#/definitions/Assertion"

definitions:
  AccountNode:
    allOf:
      - $ref: "../../../base_schema.yaml#/definitions/AccountNode"
      - properties:
          account:
            $ref: "./account.schema.json"
          children:
            items:
              $ref: "#/definitions/AccountNode"

  Assertion:
    allOf:
      - $ref: "../../../base_schema.yaml#/definitions/Assertion"
      - properties:
          terms:
            items:
              $ref: "#/definitions/AssertionTerm"

  AssertionTerm:
    allOf:
      - $ref: "../../../base_schema.yaml#/definitions/AssertionTerm"
      - properties:
          account:
            $ref: "./account.schema.json"

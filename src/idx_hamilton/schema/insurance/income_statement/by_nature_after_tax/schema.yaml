$schema: ./schema.extension.yaml
entry_point: insurance
statement: income_statement
variant: by_nature_after_tax
chart_of_accounts:
- account: ComprehensiveIncome
  code: CI
  is_total: true
  children:
  - account: ProfitLoss
    code: PL
    is_total: true
    children:
    - account: ProfitLossFromDiscontinuedOperations
      code: PL.DISC
    - account: ProfitLossFromContinuingOperations
      code: PL.CONT
      is_total: true
      children:
      - account: ProfitLossBeforeIncomeTax
        code: PBT
        is_total: true
        children:
        - account: RevenueFromInsurancePremiums
          code: PBT.01
        - account: ReinsurancePremiums
          code: PBT.02
          weight: -1
        - account: RetrocessionPremiums
          code: PBT.03
          weight: -1
        - account: DecreaseIncreaseInUnearnedPremiums
          code: PBT.04
        - account: DecreaseIncreaseInPremiumIncomeCededToReinsurancer
          code: PBT.05
          weight: -1
        - account: CommissionIncome
          code: PBT.06
        - account: NetInvestmentIncome
          code: PBT.07
        - account: UjrahReceived
          code: PBT.08
        - account: GainsLossesOnSaleOfSecuritiesAndMutualFundsAtFairValueThroughProfitOrLoss
          code: PBT.09
        - account: GainsLossesOnSaleOfSharesOfStock
          code: PBT.10
        - account: UnrealisedFairValueGainsLossesOnSecuritiesAndMutualFundsAtFairValueThroughProfitOrLoss
          code: PBT.11
        - account: OtherUnderwritingIncome
          code: PBT.12
        - account: ClaimExpenses
          code: PBT.13
          weight: -1
        - account: ReinsuranceClaims
          code: PBT.14
        - account: RetrocessionClaims
          code: PBT.15
        - account: IncreaseDecreaseInEstimatedClaimsLiability
          code: PBT.16
          weight: -1
        - account: IncreaseDecreaseInLiabilityForFuturePolicyBenefit
          code: PBT.17
          weight: -1
        - account: IncreaseDecreaseInProvisionForLossesArisingFromLiabilityAdequacyTest
          code: PBT.18
          weight: -1
        - account: IncreaseDecreaseInInsuranceLiabilitiesCededToReinsurers
          code: PBT.19
        - account: IncreaseDecreaseInLiabilitiesToPolicyholderInUnitLinkedContracts
          code: PBT.20
          weight: -1
        - account: CommissionExpenses
          code: PBT.21
          weight: -1
        - account: OtherUnderwritingExpenses
          code: PBT.22
          weight: -1
        - account: UjrahPaid
          code: PBT.23
          weight: -1
        - account: AcquisitionCostsOfInsuranceContracts
          code: PBT.24
          weight: -1
        - account: GeneralAndAdministrativeExpenses
          code: PBT.25
          weight: -1
        - account: InterestAndFinanceCosts
          code: PBT.26
          weight: -1
        - account: GainsLossesOnSaleOfAvailableForSaleSecurities
          code: PBT.27
      - account: TaxBenefitExpenses
        code: TAX.BENEFIT
  - account: OtherComprehensiveIncomeAfterTax
    code: OCI
    is_total: true
- account: ProfitLoss
  code: PL.ATTRIB
  is_total: true
  children:
  - account: ProfitLossAttributableToParentEntity
    code: PL.ATTRIB.PE
  - account: ProfitLossAttributableToNonControllingInterests
    code: PL.ATTRIB.NCI
- account: ComprehensiveIncome
  code: CI.ATTRIB
  is_total: true
  children:
  - account: ComprehensiveIncomeAttributableToParentEntity
    code: CI.ATTRIB.PE
  - account: ComprehensiveIncomeAttributableToNonControllingInterests
    code: CI.ATTRIB.NCI
- account: BasicEarningsLossPerShareFromContinuingOperations
  code: DISC.PL.01
- account: BasicEarningsLossPerShareFromDiscontinuedOperations
  code: DISC.PL.02
- account: CarryingAmountOfNonFinancialAssetLiabilityWhoseAcquisitionOrIncurrenceWasHedgedOnHighlyProbableForecastTransactionAdjustedFromEquityAfterTax

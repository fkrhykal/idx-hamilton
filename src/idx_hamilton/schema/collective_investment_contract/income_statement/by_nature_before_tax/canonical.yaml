    account: DividendsIncome
    weight: 1
  - &id003
    account: GainsLossesFromSecuritiesPortfolio
    weight: 1
  - &id004
    account: EBAInterest
    weight: 1
  - &id005
    account: SupportingServices
    weight: 1

$schema: http://json-schema.org/draft-07/schema#
allOf:
- $ref: ../../../base_canonical_schema.yaml
properties:
  entry_point:
    const: collective_investment_contract
  statement:
    const: cashflow_statement
  variant:
    const: direct_method
  mappings:
    type: array
    items:
      type: object
      properties:
        canonical_account:
          enum:
          - OperatingCashFlow
          - InvestingCashFlow
          - FinancingCashFlow
        components:
          type: array
          items:
            type: object
            properties:
              account:
                $ref: ./account.schema.json

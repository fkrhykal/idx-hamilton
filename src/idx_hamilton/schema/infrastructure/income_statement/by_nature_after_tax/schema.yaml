      code: PL.DISC
    - account: ProfitLossFromContinuingOperations
      code: PL.CONT
      is_total: true
      children:
      - account: ProfitLossBeforeIncomeTax
        code: PBT
        is_total: true
        children:
        - account: SalesAndRevenue
          code: PBT.01
        - account: OtherIncome
          code: PBT.02
        - account: ExplorationExpenses
          code: PBT.03
          weight: -1
        - account: TollCollectionExpenses

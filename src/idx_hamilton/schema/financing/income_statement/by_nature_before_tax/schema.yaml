    code: PL.ATTRIB.NCI
- account: ComprehensiveIncome
  code: CI.ATTRIB
  is_total: true
  children:
  - account: ComprehensiveIncomeAttributableToParentEntity
    code: CI.ATTRIB.PE
  - account: ComprehensiveIncomeAttributableToNonControllingInterests
    code: CI.ATTRIB.NCI

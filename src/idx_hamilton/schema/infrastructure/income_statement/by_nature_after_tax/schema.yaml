          weight: -1
        - account: ConstructionExpenses
          code: PBT.08
          weight: -1
        - account: FlightOperationsExpenses
          code: PBT.09
          weight: -1
        - account: InterconnectionExpenses
          code: PBT.10
          weight: -1
        - account: TicketingSalesAndPromotionExpenses
          code: PBT.11
          weight: -1
        - account: PassengerServicesExpenses
          code: PBT.12
          weight: -1
        - account: UserChargesAndStationExpenses
          code: PBT.13
          weight: -1
        - account: MaintenanceAndOverhaulExpenses
          code: PBT.14
          weight: -1
        - account: TransportationOperationExpenses
          code: PBT.15
          weight: -1
        - account: NetworkOperationExpenses
          code: PBT.16
          weight: -1
        - account: HotelOperationExpenses
          code: PBT.17
          weight: -1
        - account: EmployeeBenefitsExpenses
          code: PBT.18
          weight: -1
        - account: DepreciationAndAmortisationExpenses
          code: PBT.19
          weight: -1
        - account: AdditionReversalOfImpairmentLossRecognisedInProfitOrLoss
          code: PBT.20
          weight: -1
        - account: OtherExpenses
          code: PBT.21
          weight: -1
        - account: OtherGainsLosses
          code: PBT.22
        - account: FinanceIncome
          code: PBT.23
        - account: InterestAndFinanceCosts
          code: PBT.24
          weight: -1

$schema: http://json-schema.org/draft-07/schema#
allOf:
- $ref: ../../../base_canonical_schema.yaml
properties:
  entry_point:
    const: property
  statement:
    const: income_statement
  variant:
    const: by_function_after_tax
  mappings:
    type: array
    items:
      type: object
      properties:
        canonical_account:
          enum:
          - ProfitBeforeTax
          - IncomeTaxExpense
          - NetIncome
          - NetIncomeAttributableToParent
          - Revenue
          - CostOfSales
          - GrossProfit
          - OperatingProfit
          - FinanceCosts
        components:
          type: array
          items:
            type: object
            properties:
              account:
                $ref: ./account.schema.json
